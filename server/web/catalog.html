<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse the SysGap hardware catalog.">
    <meta name="theme-color" content="#18232b">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SysGap">
    <meta property="og:title" content="SysGap catalog">
    <meta property="og:description" content="Browse the SysGap hardware catalog.">
    <meta property="og:url" content="https://sysgap.wrawler.online/catalog">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://sysgap.wrawler.online/catalog">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Catalog | SysGap</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/config.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body data-page="catalog">
    <header class="site-header">
      <a class="brand" href="/" aria-label="SysGap home"><span class="brand-mark" aria-hidden="true">S</span><span>SysGap</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a class="button button-small button-quiet" href="/downloads/sysgap-client.zip" download>Download app</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode"><span aria-hidden="true" data-theme-icon>☾</span><span data-theme-label>Dark mode</span></button>
      </nav>
    </header>

    <main class="catalog-main page-width">
      <div class="catalog-heading">
        <div><p class="eyebrow">The parts index</p><h1>Browse the catalog.</h1><p class="hero-lede">A clean view of the component records available to the SysGap engine.</p></div>
        <div class="catalog-meta"><span class="status-dot"></span><span data-catalog-status>Connecting to catalog...</span></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Catalog component types" data-tabs></div>
      <section class="catalog-results" aria-live="polite">
        <div class="card-grid" data-card-grid></div>
        <div class="catalog-message" data-catalog-message>Loading catalog records...</div>
      </section>
      <nav class="pagination" aria-label="Catalog pages" data-pagination></nav>
    </main>

    <footer class="site-footer page-width"><span>SysGap <span class="muted">/ catalog</span></span><a class="muted" href="/">Back to home</a></footer>
  </body>
</html>
