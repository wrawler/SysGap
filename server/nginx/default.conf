# server/nginx/default.conf
server {
    listen 80;
    server_name localhost;

    location = /catalog {
        return 302 /catalog.html;
    }

    location = /catalog/ {
        return 301 /catalog;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|zip)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Serve static frontend web files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API traffic to the FastAPI container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }
}