services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      AZURE_BLOB_CONTAINER: reports
      AZURE_TABLE_NAME: Reports
    volumes:
      - report-data:/app/runtime/reports

  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  report-data:
