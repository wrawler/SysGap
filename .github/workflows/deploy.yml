name: Deploy Azure Container App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: server/backend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/sysgap-api:${{ github.sha }}
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/terraform
        env:
          TF_VAR_container_image: ${{ secrets.ACR_LOGIN_SERVER }}/sysgap-api:${{ github.sha }}
          TF_VAR_container_registry_server: ${{ secrets.ACR_LOGIN_SERVER }}
          TF_VAR_container_registry_username: ${{ secrets.ACR_USERNAME }}
          TF_VAR_container_registry_password: ${{ secrets.ACR_PASSWORD }}
          TF_VAR_frontend_api_url: ${{ secrets.FRONTEND_API_URL }}
          TF_VAR_allowed_frontend_origins: ${{ secrets.ALLOWED_FRONTEND_ORIGINS }}
          TF_VAR_frontend_custom_domain: ${{ secrets.FRONTEND_CUSTOM_DOMAIN }}
        run: |
          terraform init
          terraform apply -auto-approve
      - name: Configure frontend API origin
        env:
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
        run: |
          printf 'window.SYSGAP_API_BASE = "%s";\n' "$FRONTEND_API_URL" > server/web/config.js
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: server/web
          skip_app_build: true
