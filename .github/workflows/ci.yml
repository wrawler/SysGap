name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r db/requirements.txt pytest
      - run: PYTHONPATH=. pytest -q
      - run: python -m json.tool catalog/manifest.json >/dev/null
      - run: python -m compileall -q db shared
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check
        working-directory: ../..
